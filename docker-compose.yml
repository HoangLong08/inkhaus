services:
  postgres:
    image: postgres:17-alpine
    container_name: inkhaus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkhaus
      POSTGRES_PASSWORD: inkhaus
      POSTGRES_DB: inkhaus
    ports:
      - "5432:5432"
    volumes:
      - inkhaus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkhaus -d inkhaus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inkhaus-pgdata:
